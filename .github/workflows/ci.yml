name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dev deps
        run: npm install

      - name: Build (tsc -> lib/)
        run: npm run build

      - name: Run state-machine unit tests
        run: npm test

      - name: Prompt length & fixture gates
        run: |
          set -euo pipefail
          CORE=$(wc -m < prompts/core.md)
          echo "core.md chars = $CORE (gate: <= 4000)"
          test "$CORE" -le 4000
          N=$(node -e "console.log(JSON.parse(require('fs').readFileSync('tests/fixtures.json','utf8')).length)")
          echo "fixtures = $N (gate: == 15)"
          test "$N" -eq 15
          echo "gates passed"
